[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "expkit"
version = "0.1.0"
description = "Python SDK for running ML experiments with local or SageMaker execution and live metrics"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  {name = "ExpKit Team"},
]
keywords = ["ml", "experiment-tracking", "sagemaker", "training", "sdk"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries",
]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "psycopg[binary]>=3.2.0",
  "python-dotenv>=1.0.1",
  "boto3>=1.34.0",
]

[project.optional-dependencies]
dev = [
  "build>=1.2.2",
  "twine>=5.1.1",
  "pytest>=8.3.0",
]

[project.urls]
Homepage = "https://github.com/expkit/expkit"
Documentation = "https://github.com/expkit/expkit#readme"
Issues = "https://github.com/expkit/expkit/issues"

[project.scripts]
expkit = "expkit.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["expkit*"]
